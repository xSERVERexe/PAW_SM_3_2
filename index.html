<!doctype html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>3_2</title>
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
    </head>
    <body>
        <h2>Dane klimatyczne NOAA</h2>

        <form id="noaaForm">
            <div>
                <label>Token API:</label><br />
                <input
                    type="password"
                    id="apiTokenInput"
                    placeholder="Wklej swój token..."
                    required
                />
            </div>
            <div>
                <label>Dataset ID:</label><br />
                <input type="text" id="datasetInput" value="GHCND" required />
            </div>
            <div>
                <label>Location ID:</label><br />
                <input
                    type="text"
                    id="locationInput"
                    value="ZIP:28801"
                    required
                />
            </div>
            <div>
                <label>Start Date:</label><br />
                <input
                    type="date"
                    id="startDateInput"
                    value="2010-05-01"
                    required
                />
            </div>
            <div>
                <label>End Date:</label><br />
                <input
                    type="date"
                    id="endDateInput"
                    value="2010-05-01"
                    required
                />
            </div>
            <button type="submit" style="margin-top: 10px">Pobierz dane</button>
        </form>

        <div id="messageContainer"></div>

        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Datatype</th>
                    <th>Station</th>
                    <th>Value</th>
                </tr>
            </thead>
            <tbody id="dataTableBody"></tbody>
        </table>
    </body>
</html>
